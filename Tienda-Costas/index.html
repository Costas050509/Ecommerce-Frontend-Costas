<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FreshMix</title>
    
    <!-- Fuentes de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    
    <style>
      .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
      .icon-fill { font-variation-settings: 'FILL' 1; }
      body { background-color: #fafaf4; color: #1a1c19; font-family: 'Inter', sans-serif; }
    </style>
    
    <!-- Tailwind CSS por CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#006e2b", "primary-container": "#2dd461", "on-primary": "#ffffff",
              secondary: "#914c00", "secondary-container": "#ff8a00", "on-secondary-container": "#613100",
              surface: "#fafaf4", "on-surface": "#1a1c19", "surface-variant": "#e3e3de",
              "on-surface-variant": "#3d4a3c", "surface-container-low": "#f4f4ee",
              error: "#ba1a1a"
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              display: ["Montserrat", "sans-serif"]
            }
          }
        }
      }
    </script>
  </head>
  <body>
    <!-- El div donde React va a montar toda la aplicación -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
